<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Muhammad Abdul Wahab — System Analyst & Web Developer. Transforming business processes into digital solutions." />
  <title>Muhammad Abdul Wahab — System Analyst & Web Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy:       #0F172A;
      --navy-mid:   #1E293B;
      --navy-light: #334155;
      --slate:      #64748B;
      --mist:       #CBD5E1;
      --snow:       #F8FAFC;
      --white:      #FFFFFF;
      --gold:       #D4AF37;
      --gold-dim:   #A88B28;
      --gold-pale:  rgba(212,175,55,.10);
      --gold-line:  rgba(212,175,55,.25);
      --font-head:  'Space Grotesk', sans-serif;
      --font-body:  'Inter', sans-serif;
      --radius-sm:  4px;
      --radius:     8px;
      --radius-lg:  16px;
      --ease:       0.3s cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body { font-family: var(--font-body); background: var(--navy); color: var(--snow); line-height: 1.6; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    ul { list-style: none; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--navy); }
    ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 99px; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
    .lbl {
      font-family: var(--font-body); font-size: .7rem; font-weight: 600;
      letter-spacing: .18em; text-transform: uppercase; color: var(--gold);
    }
    .divider { width: 40px; height: 2px; background: var(--gold); margin: 1rem 0 2rem; }
    .gold { color: var(--gold); }

    /* ── LANGUAGE SWITCHER ── */
    .lang-switch {
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--navy-mid);
      border: 1px solid var(--navy-light);
      border-radius: var(--radius-sm);
      padding: 3px;
    }
    .lang-btn {
      font-family: var(--font-head);
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .06em;
      padding: .25rem .55rem;
      border-radius: 3px;
      border: none;
      background: transparent;
      color: var(--slate);
      cursor: pointer;
      transition: background var(--ease), color var(--ease);
    }
    .lang-btn.active {
      background: var(--gold);
      color: var(--navy);
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.25rem 2rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      background: rgba(15,23,42,.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(212,175,55,.12);
      transition: padding var(--ease);
    }
    nav.scrolled { padding: .9rem 2rem; }
    .nav-left { display: flex; align-items: center; gap: 1.5rem; }
    .nav-logo { font-family: var(--font-head); font-weight: 700; font-size: 1rem; letter-spacing: .04em; }
    .nav-logo span { color: var(--gold); }
    .nav-links { display: flex; gap: 1.75rem; align-items: center; }
    .nav-links a {
      font-size: .78rem; font-weight: 500; letter-spacing: .06em;
      text-transform: uppercase; color: var(--mist);
      transition: color var(--ease);
    }
    .nav-links a:hover { color: var(--gold); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-cta {
      padding: .45rem 1.1rem;
      border: 1px solid var(--gold); border-radius: var(--radius-sm);
      color: var(--gold); font-size: .78rem; font-weight: 600; letter-spacing: .04em;
      transition: background var(--ease);
    }
    .nav-cta:hover { background: var(--gold-pale); }
    .nav-toggle {
      display: none; flex-direction: column; gap: 5px;
      cursor: pointer; padding: 4px; background: none; border: none;
    }
    .nav-toggle span { display: block; width: 22px; height: 2px; background: var(--snow); border-radius: 2px; }

    /* ── MOBILE NAV ── */
    .mobile-nav {
      display: none; position: fixed; inset: 0;
      background: var(--navy-mid); z-index: 99;
      flex-direction: column; align-items: center; justify-content: center; gap: 2rem;
    }
    .mobile-nav.open { display: flex; }
    .mobile-nav a { font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; color: var(--mist); transition: color var(--ease); }
    .mobile-nav a:hover { color: var(--gold); }
    .mobile-close { position: absolute; top: 1.5rem; right: 2rem; background: none; border: none; color: var(--mist); font-size: 1.5rem; cursor: pointer; }
    .mobile-lang { margin-top: 1rem; }

    /* ── HERO ── */
    #hero {
      min-height: 100vh; display: flex; flex-direction: column;
      justify-content: center; position: relative; overflow: hidden;
      padding: 8rem 0 5rem;
    }
    #hero::before {
      content: ''; position: absolute; inset: 0;
      background-image: linear-gradient(rgba(212,175,55,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(212,175,55,.04) 1px, transparent 1px);
      background-size: 60px 60px; pointer-events: none;
    }
    #hero::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 70% at 60% 50%, transparent 0%, var(--navy) 80%);
      pointer-events: none;
    }
    .hero-inner { position: relative; z-index: 1; }
    .hero-rule { width: 1px; height: 80px; background: linear-gradient(to bottom, transparent, var(--gold)); margin-bottom: 2rem; }
    .hero-eyebrow { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .hero-eyebrow .lbl { color: var(--mist); }
    .hero-eyebrow .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
    .hero-headline {
      font-family: var(--font-head); font-size: clamp(2.4rem, 6vw, 5rem);
      font-weight: 700; line-height: 1.08; letter-spacing: -.02em;
      color: var(--white); max-width: 820px; margin-bottom: 1.5rem;
    }
    .hero-headline em { font-style: normal; color: var(--gold); }
    .hero-sub { max-width: 520px; font-size: 1rem; color: var(--mist); line-height: 1.7; margin-bottom: 3rem; }
    .hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 5rem; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .75rem 1.75rem; background: var(--gold); color: var(--navy);
      font-family: var(--font-head); font-weight: 600; font-size: .875rem;
      letter-spacing: .04em; border-radius: var(--radius-sm);
      transition: opacity var(--ease);
    }
    .btn-primary:hover { opacity: .88; }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .75rem 1.75rem; border: 1px solid var(--navy-light);
      color: var(--mist); font-family: var(--font-head); font-weight: 500;
      font-size: .875rem; letter-spacing: .04em; border-radius: var(--radius-sm);
      transition: border-color var(--ease), color var(--ease);
    }
    .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
    .hero-stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 1px; background: var(--navy-light);
      border: 1px solid var(--navy-light); border-radius: var(--radius);
      overflow: hidden; max-width: 640px;
    }
    .stat-cell { background: var(--navy-mid); padding: 1.5rem 2rem; position: relative; }
    .stat-cell::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; background: var(--gold); opacity: 0; transition: opacity var(--ease);
    }
    .stat-cell:hover::before { opacity: 1; }
    .stat-num { font-family: var(--font-head); font-size: 2.25rem; font-weight: 700; color: var(--white); line-height: 1; margin-bottom: .35rem; }
    .stat-num span { color: var(--gold); }
    .stat-desc { font-size: .72rem; color: var(--slate); letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }

    /* ── SECTIONS SHARED ── */
    section { padding: 6rem 0; }
    .section-header { margin-bottom: 3.5rem; }
    .section-title { font-family: var(--font-head); font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; color: var(--white); }
    .section-sub { color: var(--slate); font-size: .95rem; max-width: 520px; margin-top: .75rem; line-height: 1.7; }

    /* ── PROCESS ── */
    #process { background: var(--navy-mid); }
    .process-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 1px; background: var(--navy-light);
      border: 1px solid var(--navy-light); border-radius: var(--radius-lg); overflow: hidden;
    }
    .process-step { background: var(--navy-mid); padding: 2.5rem 2rem; position: relative; transition: background var(--ease); }
    .process-step:hover { background: #243249; }
    .process-step-num { font-family: var(--font-head); font-size: .7rem; font-weight: 600; letter-spacing: .14em; color: var(--gold); margin-bottom: 1.5rem; }
    .process-icon { width: 44px; height: 44px; border: 1px solid var(--gold-line); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; margin-bottom: 1.25rem; }
    .process-icon svg { width: 20px; height: 20px; stroke: var(--gold); fill: none; stroke-width: 1.5; }
    .process-name { font-family: var(--font-head); font-size: 1.1rem; font-weight: 700; color: var(--white); margin-bottom: .75rem; }
    .process-desc { font-size: .85rem; color: var(--slate); line-height: 1.7; }
    .process-arrow { position: absolute; top: 50%; right: -14px; transform: translateY(-50%); z-index: 2; width: 28px; height: 28px; border-radius: 50%; background: var(--navy); border: 1px solid var(--gold-line); display: flex; align-items: center; justify-content: center; }
    .process-arrow svg { width: 12px; height: 12px; stroke: var(--gold); fill: none; stroke-width: 2; }
    .process-step:last-child .process-arrow { display: none; }

    /* ── CASE STUDIES ── */
    #case-studies { background: var(--navy); }
    .case-list { display: flex; flex-direction: column; gap: 2px; }
    .case-item { border: 1px solid var(--navy-light); border-radius: var(--radius); overflow: hidden; transition: border-color var(--ease); }
    .case-item:hover { border-color: var(--gold-line); }
    .case-header { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 2rem 2.5rem; cursor: pointer; background: var(--navy-mid); gap: 1.5rem; }
    .case-meta { display: flex; align-items: center; gap: 1.25rem; margin-bottom: .5rem; }
    .case-tag { font-size: .65rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: .2rem .6rem; background: var(--gold-pale); border: 1px solid var(--gold-line); border-radius: var(--radius-sm); color: var(--gold); }
    .case-year { font-size: .7rem; color: var(--slate); letter-spacing: .08em; }
    .case-title { font-family: var(--font-head); font-size: 1.2rem; font-weight: 700; color: var(--white); }
    .case-toggle { width: 32px; height: 32px; border: 1px solid var(--navy-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: border-color var(--ease); flex-shrink: 0; }
    .case-toggle svg { width: 14px; height: 14px; stroke: var(--mist); fill: none; stroke-width: 2; transition: transform var(--ease); }
    .case-item.open .case-toggle svg { transform: rotate(45deg); }
    .case-item.open .case-toggle { border-color: var(--gold); }
    .case-body { max-height: 0; overflow: hidden; transition: max-height .5s cubic-bezier(0.4,0,0.2,1); }
    .case-item.open .case-body { max-height: 900px; }
    .case-content { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--navy-light); border-top: 1px solid var(--navy-light); }
    .case-field { background: var(--navy); padding: 1.75rem 2rem; }
    .case-field-label { font-size: .65rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: .75rem; }
    .case-field-text { font-size: .85rem; color: var(--mist); line-height: 1.65; }
    .tech-pills { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
    .tech-pill { font-size: .65rem; padding: .2rem .55rem; background: var(--navy-mid); border: 1px solid var(--navy-light); border-radius: 99px; color: var(--mist); }

    /* ── SKILLS ── */
    #skills { background: var(--navy-mid); }
    .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
    .skill-category { background: var(--navy); border: 1px solid var(--navy-light); border-radius: var(--radius); padding: 1.75rem; transition: border-color var(--ease); }
    .skill-category:hover { border-color: var(--gold-line); }
    .skill-cat-head { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.5rem; }
    .skill-cat-icon { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--gold-pale); border: 1px solid var(--gold-line); display: flex; align-items: center; justify-content: center; }
    .skill-cat-icon svg { width: 16px; height: 16px; stroke: var(--gold); fill: none; stroke-width: 1.75; }
    .skill-cat-name { font-family: var(--font-head); font-size: .85rem; font-weight: 600; color: var(--white); }
    .skill-items { display: flex; flex-direction: column; gap: .85rem; }
    .skill-bar-row { display: flex; flex-direction: column; gap: .3rem; }
    .skill-bar-top { display: flex; justify-content: space-between; align-items: baseline; }
    .skill-name { font-size: .78rem; color: var(--mist); }
    .skill-pct { font-size: .7rem; color: var(--slate); font-family: var(--font-head); }
    .bar-track { height: 3px; background: var(--navy-light); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 99px; width: 0; transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }

    /* ── TIMELINE ── */
    #timeline { background: var(--navy); }
    .timeline-track { position: relative; padding-left: 2rem; }
    .timeline-track::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: linear-gradient(to bottom, var(--gold), transparent); }
    .timeline-entry { position: relative; padding: 0 0 3rem 2.5rem; opacity: 0; transform: translateX(-20px); transition: opacity .6s ease, transform .6s ease; }
    .timeline-entry.visible { opacity: 1; transform: translateX(0); }
    .timeline-dot { position: absolute; left: -4.5px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--navy); border: 2px solid var(--gold); transition: background var(--ease); }
    .timeline-entry:hover .timeline-dot { background: var(--gold); }
    .timeline-period { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: .4rem; }
    .timeline-event-title { font-family: var(--font-head); font-size: 1rem; font-weight: 700; color: var(--white); margin-bottom: .4rem; }
    .timeline-event-detail { font-size: .85rem; color: var(--slate); line-height: 1.6; }
    .timeline-badge { display: inline-block; margin-top: .5rem; font-size: .65rem; padding: .2rem .55rem; border-radius: 99px; border: 1px solid var(--navy-light); color: var(--mist); }

    /* ── CERTIFICATIONS ── */
    #certifications { background: var(--navy-mid); }
    .cert-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .cert-card { background: var(--navy); border: 1px solid var(--navy-light); border-radius: var(--radius); padding: 1.75rem; position: relative; overflow: hidden; transition: border-color var(--ease), transform var(--ease); }
    .cert-card:hover { border-color: var(--gold-line); transform: translateY(-3px); }
    .cert-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--gold), transparent); }
    .cert-issuer { font-size: .65rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: .5rem; }
    .cert-name { font-family: var(--font-head); font-size: .95rem; font-weight: 700; color: var(--white); line-height: 1.35; margin-bottom: .75rem; }
    .cert-date { font-size: .75rem; color: var(--slate); }
    .cert-status { display: inline-flex; align-items: center; gap: .35rem; font-size: .65rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-top: .75rem; }
    .cert-status.done { color: #4ADE80; }
    .cert-status.done::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #4ADE80; }
    .cert-status.wip { color: var(--gold); }
    .cert-status.wip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

    /* ── CONTACT ── */
    #contact { background: var(--navy); }
    .contact-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: start; }
    .contact-headline { font-family: var(--font-head); font-size: clamp(1.6rem, 3.5vw, 2.4rem); font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 1rem; }
    .contact-copy { font-size: .9rem; color: var(--mist); line-height: 1.7; margin-bottom: 2rem; }
    .contact-channels { display: flex; flex-direction: column; gap: .75rem; }
    .contact-link { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem; background: var(--navy-mid); border: 1px solid var(--navy-light); border-radius: var(--radius); transition: border-color var(--ease), transform var(--ease); }
    .contact-link:hover { border-color: var(--gold-line); transform: translateX(4px); }
    .contact-link-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--gold-pale); border: 1px solid var(--gold-line); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .contact-link-icon svg { width: 16px; height: 16px; stroke: var(--gold); fill: none; stroke-width: 1.75; }
    .contact-link-text { flex: 1; }
    .contact-link-label { font-size: .65rem; color: var(--slate); letter-spacing: .1em; text-transform: uppercase; }
    .contact-link-value { font-size: .9rem; color: var(--white); font-weight: 500; }
    .cla { stroke: var(--slate); transition: stroke var(--ease); }
    .contact-link:hover .cla { stroke: var(--gold); }
    .availability-card { background: var(--navy-mid); border: 1px solid var(--gold-line); border-radius: var(--radius); padding: 2rem; margin-bottom: 2rem; }
    .avail-indicator { display: flex; align-items: center; gap: .6rem; margin-bottom: .75rem; }
    .avail-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ADE80; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(1.3)} }
    .avail-text { font-size: .75rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #4ADE80; }
    .avail-desc { font-size: .85rem; color: var(--mist); line-height: 1.6; }

    footer { border-top: 1px solid var(--navy-light); padding: 2rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .footer-copy { font-size: .78rem; color: var(--slate); }
    .footer-mark { font-family: var(--font-head); font-size: .8rem; font-weight: 600; color: var(--mist); }
    .footer-mark span { color: var(--gold); }

    /* ── REVEAL ── */
    .re
